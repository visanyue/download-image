name: Build Full Trading Web Image

on:
  workflow_dispatch:

jobs:
  build-and-save:
    runs-on: ubuntu-latest
    steps:
      # 1. 抓取原项目的最新全套源码
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: 'BG8CFB/TradingAgents-CN'
          ref: 'main'

      # 2. 现场编译出跟作者名字一模一样的合体 web 镜像
      - name: Build Full Web Image
        run: |
          docker build -t hsliuping/tradingagents-cn:latest -f Dockerfile .

      # 3. 把这个做好的大镜像，加上官方数据库和缓存，全部打包成物理文件
      - name: Save All Images to Tar
        run: |
          docker pull mongo:7
          docker pull redis:7
          docker save hsliuping/tradingagents-cn:latest -o web.tar
          docker save mongo:7 -o mongo.tar
          docker save redis:7 -o redis.tar

      # 4. 压缩成一个 ZIP 供你电脑高速下载
      - name: Upload Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: full-trading-package
          path: |
            web.tar
            mongo.tar
            redis.tar
          retention-days: 1
